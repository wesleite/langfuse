langfuse:
  salt:
    secretKeyRef:
      name: langfuse-secrets
      key: salt
  encryptionKey:
    secretKeyRef:
      name: langfuse-secrets
      key: encryption-key
  nextauth:
    url: "https://langfuse.meudominio.com"
    secret:
      secretKeyRef:
        name: langfuse-secrets
        key: nextauth-secret

  additionalEnv:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: DATABASE_URL
    - name: LANGFUSE_INIT_ORG_ID
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: LANGFUSE_INIT_ORG_ID
    - name: LANGFUSE_INIT_ORG_NAME
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: LANGFUSE_INIT_ORG_NAME
    - name: LANGFUSE_INIT_PROJECT_ID
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: LANGFUSE_INIT_PROJECT_ID
    - name: LANGFUSE_INIT_PROJECT_NAME
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: LANGFUSE_INIT_PROJECT_NAME
    - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
    - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: LANGFUSE_INIT_PROJECT_SECRET_KEY
    - name: LANGFUSE_INIT_USER_EMAIL
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: LANGFUSE_INIT_USER_EMAIL
    - name: LANGFUSE_INIT_USER_NAME
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: LANGFUSE_INIT_USER_NAME
    - name: LANGFUSE_INIT_USER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: LANGFUSE_INIT_USER_PASSWORD

  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::<SEU_ACCOUNT_ID>:role/<NOME_DA_ROLE_IRSA>"

  # Hardening a nível de Pod/Container (chart não aplica nada por default —
  # langfuse.podSecurityContext/langfuse.securityContext vêm {} de fábrica).
  # readOnlyRootFilesystem não foi setado: não validado se o Next.js standalone
  # (web) e o worker escrevem em caminhos fora de volumes montados.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:<SEU_ACCOUNT_ID>:certificate/<ID_DO_CERTIFICADO>"
      alb.ingress.kubernetes.io/healthcheck-path: "/api/public/health"
    hosts:
      - host: "langfuse.meudominio.com"
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: false

  web:
    replicas: 2
    image:
      repository: "<SEU_ACCOUNT_ID>.dkr.ecr.<SUA_REGIAO_AWS>.amazonaws.com/langfuse-web"
      tag: "4.24.0"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    pdb:
      create: true
      maxUnavailable: 1

  worker:
    replicas: 2
    image:
      repository: "<SEU_ACCOUNT_ID>.dkr.ecr.<SUA_REGIAO_AWS>.amazonaws.com/langfuse-worker"
      tag: "4.24.0"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    pdb:
      create: true
      maxUnavailable: 1

postgresql:
  deploy: false

seaweedfs:
  enabled: false

s3:
  deploy: false
  storageProvider: "s3"
  bucket: "meu-langfuse-bucket-producao"
  region: "us-east-1"
  endpoint: ""
  forcePathStyle: false

redis:
  deploy: true
  host: "langfuse-redis"
  port: 6379
  auth:
    enabled: true
    username: "default"
    existingSecret: langfuse-secrets
    existingSecretPasswordKey: redis-password
    usersExistingSecret: langfuse-secrets
  resources:
    requests:
      cpu: "25m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  dataStorage:
    className: gp3

clickhouse:
  deploy: true
  host: "langfuse-clickhouse-headless"
  httpPort: 8123
  nativePort: 9000
  database: default
  crdCheck: true
  auth:
    username: default
    existingSecret: langfuse-secrets
    existingSecretKey: clickhouse-password
  cluster:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1.5Gi"
    storage:
      size: 3Gi
      className: gp3
  keeper:
    enabled: true
    replicas: 3
    storage:
      size: 3Gi
      className: gp3
