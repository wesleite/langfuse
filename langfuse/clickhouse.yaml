# ==============================================================================
# Configurações do ClickHouse e Keeper
# ------------------------------------------------------------------------------
# Senha vem do Secret "langfuse" (secrets.yaml), chave "clickhouse-password".
# ==============================================================================
clickhouse:
  deploy: true
  host: "langfuse-clickhouse-headless"
  httpPort: 8123
  nativePort: 9000
  database: default
  crdCheck: true

  auth:
    username: default
    existingSecret: langfuse
    existingSecretKey: clickhouse-password

  cluster:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1.5Gi"
    storage:
      size: 3Gi

  keeper:
    enabled: true
    replicas: 3
    storage:
      size: 3Gi
