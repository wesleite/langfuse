# Substitui o kubectl apply -f secrets.local.yaml em homolog/prod: o ESO cria e
# mantém sincronizado o Secret "langfuse-secrets" a partir do Parameter Store —
# mesmo nome/mesmas keys que web.yaml/worker.yaml já esperam via secretKeyRef,
# então nenhuma mudança é necessária nos values do chart.
# "default" e "redis-password" apontam para o MESMO parâmetro (mesmo valor
# usado em dois lugares do chart: existingSecretPasswordKey e usersExistingSecret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-secrets
  namespace: langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: langfuse-parameterstore
  target:
    name: langfuse-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: "/langfuse/<AMBIENTE>/database-url"
    - secretKey: encryption-key
      remoteRef:
        key: "/langfuse/<AMBIENTE>/encryption-key"
    - secretKey: salt
      remoteRef:
        key: "/langfuse/<AMBIENTE>/salt"
    - secretKey: nextauth-secret
      remoteRef:
        key: "/langfuse/<AMBIENTE>/nextauth-secret"
    - secretKey: redis-password
      remoteRef:
        key: "/langfuse/<AMBIENTE>/redis-password"
    - secretKey: default
      remoteRef:
        key: "/langfuse/<AMBIENTE>/redis-password"
    - secretKey: clickhouse-password
      remoteRef:
        key: "/langfuse/<AMBIENTE>/clickhouse-password"
    - secretKey: LANGFUSE_INIT_ORG_ID
      remoteRef:
        key: "/langfuse/<AMBIENTE>/init-org-id"
    - secretKey: LANGFUSE_INIT_ORG_NAME
      remoteRef:
        key: "/langfuse/<AMBIENTE>/init-org-name"
    - secretKey: LANGFUSE_INIT_PROJECT_ID
      remoteRef:
        key: "/langfuse/<AMBIENTE>/init-project-id"
    - secretKey: LANGFUSE_INIT_PROJECT_NAME
      remoteRef:
        key: "/langfuse/<AMBIENTE>/init-project-name"
    - secretKey: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
      remoteRef:
        key: "/langfuse/<AMBIENTE>/init-project-public-key"
    - secretKey: LANGFUSE_INIT_PROJECT_SECRET_KEY
      remoteRef:
        key: "/langfuse/<AMBIENTE>/init-project-secret-key"
    - secretKey: LANGFUSE_INIT_USER_EMAIL
      remoteRef:
        key: "/langfuse/<AMBIENTE>/init-user-email"
    - secretKey: LANGFUSE_INIT_USER_NAME
      remoteRef:
        key: "/langfuse/<AMBIENTE>/init-user-name"
    - secretKey: LANGFUSE_INIT_USER_PASSWORD
      remoteRef:
        key: "/langfuse/<AMBIENTE>/init-user-password"
