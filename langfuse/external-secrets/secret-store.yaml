# SecretStore (namespaced, não Cluster) — escopo restrito ao namespace langfuse.
# service: ParameterStore = AWS Systems Manager Parameter Store (não Secrets Manager).
# auth.jwt.serviceAccountRef delega a autenticação para a ServiceAccount com IRSA
# dedicada (service-account.yaml), em vez de usar a identidade do pod do
# controller do ESO — mesmo padrão de isolamento por role já usado pelo S3 (web.yaml).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: langfuse-parameterstore
  namespace: langfuse
spec:
  provider:
    aws:
      service: ParameterStore
      region: "<SUA_REGIAO_AWS>"
      auth:
        jwt:
          serviceAccountRef:
            name: langfuse-external-secrets
