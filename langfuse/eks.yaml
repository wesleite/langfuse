# ==============================================================================
# Overrides específicos para deploy em Amazon EKS
# ------------------------------------------------------------------------------
# Overlay a ser aplicado POR CIMA dos demais arquivos (último -f, para as
# chaves aqui sobrescreverem values.yaml/postgres.yaml/redis.yaml/clickhouse.yaml):
#
#   helm upgrade --install langfuse langfuse/langfuse -n langfuse \
#     -f values.yaml -f web.yaml -f worker.yaml -f postgres.yaml \
#     -f redis.yaml -f clickhouse.yaml -f eks.yaml
#
# Pré-requisitos ADICIONAIS aos do Kind (cert-manager + ClickHouse Operator,
# que continuam necessários — ver DEPLOY.md seção 0), específicos de EKS:
#   - AWS Load Balancer Controller instalado (fornece a IngressClass "alb")
#   - Addon EBS CSI Driver habilitado no cluster + StorageClass "gp3" criada
#     (não vem por padrão em todo cluster EKS)
#   - Bucket S3 real criado
#   - IAM Role (IRSA) com permissão de leitura/escrita nesse bucket,
#     associada via annotation à Service Account do Langfuse (sem access
#     key/secret key fixos — autenticação via identidade do pod)
#   - Certificado ACM emitido para o domínio (referenciado no Ingress)
#
# TROQUE todos os valores marcados com <...> antes de aplicar.
# ==============================================================================

langfuse:
  # URL pública real da aplicação (era http://localhost:3000 nos arquivos de lab)
  nextauth:
    url: "https://<SEU_DOMINIO>"

  # IRSA: associa a Service Account do Langfuse a uma IAM Role com acesso ao
  # bucket S3 (ver s3.* abaixo) — substitui as credenciais estáticas usadas
  # localmente (MinIO) por identidade de pod.
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::<SEU_ACCOUNT_ID>:role/<NOME_DA_ROLE_IRSA>"

  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:<SUA_REGIAO>:<SEU_ACCOUNT_ID>:certificate/<ID_DO_CERTIFICADO>"
    hosts:
      - host: "<SEU_DOMINIO>"
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      # TLS é terminado no ALB via certificate-arn acima — não precisa de
      # Secret de TLS no cluster.
      enabled: false

# ------------------------------------------------------------------------------
# S3 real (substitui o MinIO local de values.yaml). Sem accessKeyId/
# secretAccessKey fixos — zerados explicitamente para não herdar os
# secretKeyRef do MinIO local; a app autentica via IRSA (serviceAccount acima).
# ------------------------------------------------------------------------------
s3:
  deploy: false
  storageProvider: "s3"
  bucket: "<SEU_BUCKET_S3>"
  region: "<SUA_REGIAO_AWS>"
  endpoint: "" # vazio = endpoint padrão da AWS (não é MinIO)
  forcePathStyle: false # S3 real não precisa de path-style
  accessKeyId:
    value: ""
    secretKeyRef:
      name: ""
      key: ""
  secretAccessKey:
    value: ""
    secretKeyRef:
      name: ""
      key: ""

# ------------------------------------------------------------------------------
# StorageClass gp3 (EBS) no lugar do "standard" do Kind (local-path-provisioner)
# ------------------------------------------------------------------------------
postgresql:
  storage:
    className: gp3

redis:
  dataStorage:
    className: gp3

clickhouse:
  cluster:
    storage:
      className: gp3
  keeper:
    storage:
      className: gp3
