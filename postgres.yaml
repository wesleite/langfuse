# ==============================================================================
# Configurações do PostgreSQL
# ------------------------------------------------------------------------------
# Reconstruído a partir do exemplo oficial minimal-installation
# (github.com/langfuse/langfuse-k8s/tree/main/examples/minimal-installation):
# usuário/banco DEDICADOS "langfuse" (default do chart — não sobrescrevemos
# auth.username/auth.database), não o superusuário "postgres". Isso corrige
# uma suposição anterior deste projeto de que seria necessário usar o
# superusuário por causa de CREATEDB — o exemplo oficial não faz essa
# ressalva e usa o usuário dedicado normalmente.
#
# Duas referências distintas ao mesmo Secret são necessárias (mesmo padrão do
# secret.yaml oficial):
#  - auth.existingSecret + secretKeys: credenciais que a app (web/worker) usa
#    para montar a DATABASE_URL (usuário "langfuse").
#  - settings.existingSecret / userDatabase.existingSecret: credenciais que o
#    próprio subchart do Postgres usa para inicializar o container (superuser
#    "postgres" + criação do usuário/banco "langfuse").
# ==============================================================================
postgresql:
  deploy: true
  host: "langfuse-postgresql"
  port: 5432

  auth:
    existingSecret: langfuse
    secretKeys:
      userPasswordKey: postgresql-password
      adminPasswordKey: postgresql-password

  settings:
    existingSecret: langfuse

  userDatabase:
    existingSecret: langfuse

  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

  storage:
    requestedSize: 2Gi
    className: gp3 # EBS no EKS — remova/deixe "" no Kind (usa "standard")
