# ==============================================================================
# Configurações do PostgreSQL
# ------------------------------------------------------------------------------
# Credenciais vêm do Secret "langfuse" (secrets.yaml). A app conecta como
# superusuário "postgres"/db "postgres" — ver comentário em secrets.yaml sobre
# por que não usamos um usuário dedicado "langfuse" (CREATEDB necessário para
# `prisma migrate` no startup do web).
#
# Duas referências distintas ao mesmo Secret são necessárias:
#  - auth.existingSecret + secretKeys: credenciais que a app (web/worker) usa
#    para montar a DATABASE_URL.
#  - settings.existingSecret / userDatabase.existingSecret: credenciais que o
#    próprio subchart do Postgres usa para inicializar o container (senão ele
#    tenta usar o Secret padrão "langfuse-postgresql-auth", que não existe).
# ==============================================================================
postgresql:
  deploy: true
  host: "langfuse-postgresql"
  port: 5432

  auth:
    username: postgres
    database: postgres
    existingSecret: langfuse
    secretKeys:
      userPasswordKey: postgresql-password
      adminPasswordKey: postgresql-password

  settings:
    existingSecret: langfuse

  userDatabase:
    existingSecret: langfuse

  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

  storage:
    requestedSize: 2Gi
