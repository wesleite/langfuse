# ==============================================================================
# Configurações do Langfuse - Worker
# ------------------------------------------------------------------------------
# Duplica os mesmos segredos/env de web.yaml (salt/encryptionKey/nextauth/
# additionalEnv) para que este arquivo seja autossuficiente — ver secrets.yaml
# e DEPLOY.md. Correção: `langfuse.replicaCount`/`langfuse.env` não existem no
# schema real do chart; usar `langfuse.worker.replicas`.
# ==============================================================================
langfuse:
  salt:
    secretKeyRef:
      name: langfuse
      key: salt
  encryptionKey:
    secretKeyRef:
      name: langfuse
      key: encryption-key
  nextauth:
    url: "http://localhost:3000"
    secret:
      secretKeyRef:
        name: langfuse
        key: nextauth-secret

  # Headless initialization — ver web.yaml e secrets.yaml.
  additionalEnv:
    - name: LANGFUSE_INIT_ORG_ID
      valueFrom:
        secretKeyRef:
          name: langfuse
          key: LANGFUSE_INIT_ORG_ID
    - name: LANGFUSE_INIT_ORG_NAME
      valueFrom:
        secretKeyRef:
          name: langfuse
          key: LANGFUSE_INIT_ORG_NAME
    - name: LANGFUSE_INIT_PROJECT_ID
      valueFrom:
        secretKeyRef:
          name: langfuse
          key: LANGFUSE_INIT_PROJECT_ID
    - name: LANGFUSE_INIT_PROJECT_NAME
      valueFrom:
        secretKeyRef:
          name: langfuse
          key: LANGFUSE_INIT_PROJECT_NAME
    - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
      valueFrom:
        secretKeyRef:
          name: langfuse
          key: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
    - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: langfuse
          key: LANGFUSE_INIT_PROJECT_SECRET_KEY
    - name: LANGFUSE_INIT_USER_EMAIL
      valueFrom:
        secretKeyRef:
          name: langfuse
          key: LANGFUSE_INIT_USER_EMAIL
    - name: LANGFUSE_INIT_USER_NAME
      valueFrom:
        secretKeyRef:
          name: langfuse
          key: LANGFUSE_INIT_USER_NAME
    - name: LANGFUSE_INIT_USER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: langfuse
          key: LANGFUSE_INIT_USER_PASSWORD

  worker:
    replicas: 1
    resources:
      requests:
        cpu: "50m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
