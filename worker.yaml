langfuse:
  salt:
    secretKeyRef:
      name: langfuse-secrets
      key: salt
  encryptionKey:
    secretKeyRef:
      name: langfuse-secrets
      key: encryption-key
  nextauth:
    url: "https://langfuse.meudominio.com"
    secret:
      secretKeyRef:
        name: langfuse-secrets
        key: nextauth-secret

  additionalEnv:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: DATABASE_URL

    - name: LANGFUSE_INIT_ORG_ID
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: LANGFUSE_INIT_ORG_ID
    - name: LANGFUSE_INIT_ORG_NAME
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: LANGFUSE_INIT_ORG_NAME
    - name: LANGFUSE_INIT_PROJECT_ID
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: LANGFUSE_INIT_PROJECT_ID
    - name: LANGFUSE_INIT_PROJECT_NAME
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: LANGFUSE_INIT_PROJECT_NAME
    - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
    - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: LANGFUSE_INIT_PROJECT_SECRET_KEY
    - name: LANGFUSE_INIT_USER_EMAIL
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: LANGFUSE_INIT_USER_EMAIL
    - name: LANGFUSE_INIT_USER_NAME
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: LANGFUSE_INIT_USER_NAME
    - name: LANGFUSE_INIT_USER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: langfuse-secrets
          key: LANGFUSE_INIT_USER_PASSWORD

  worker:
    replicas: 2
    image:
      repository: "<SEU_ACCOUNT_ID>.dkr.ecr.<SUA_REGIAO_AWS>.amazonaws.com/langfuse-worker"
      tag: "4.24.0"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"

redis:
  deploy: true
  host: "langfuse-redis"
  port: 6379
  auth:
    enabled: true
    username: "default"
    existingSecret: langfuse-secrets
    existingSecretPasswordKey: redis-password
    usersExistingSecret: langfuse-secrets
  resources:
    requests:
      cpu: "25m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  dataStorage:
    className: gp3

clickhouse:
  deploy: true
  host: "langfuse-clickhouse-headless"
  httpPort: 8123
  nativePort: 9000
  database: default
  crdCheck: true
  auth:
    username: default
    existingSecret: langfuse-secrets
    existingSecretKey: clickhouse-password
  cluster:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1.5Gi"
    storage:
      size: 3Gi
      className: gp3
  keeper:
    enabled: true
    replicas: 3
    storage:
      size: 3Gi
      className: gp3