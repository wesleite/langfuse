# ServiceAccount dedicada ao External Secrets Operator ler o Parameter Store —
# IRSA própria (role separada da IRSA de S3 em web.yaml), princípio do menor
# privilégio: só ssm:GetParameter*/kms:Decrypt no path /langfuse/<AMBIENTE>/*.
# Referenciada por secret-store.yaml via spec.provider.aws.auth.jwt.serviceAccountRef.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: langfuse-external-secrets
  namespace: langfuse
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<SEU_ACCOUNT_ID>:role/<NOME_DA_ROLE_IRSA_PARAMETER_STORE>"
